server:
  port: 0

data:
  sources:
    sql:
      - name: "mixed"
        provider.hikari:
          username: "sa"
          password: ""
          url: "jdbc:h2:mem:mixed-provider-runtime;DATABASE_TO_UPPER=FALSE;DB_CLOSE_DELAY=-1"
          jdbc-driver-class-name: "org.h2.Driver"
  clients:
    jdbc:
      - name: "mixed"
        data-source: "mixed"
  persistence-units:
    jakarta:
      - name: "mixed"
        data-source: "mixed"
        provider-class-name: "org.eclipse.persistence.jpa.PersistenceProvider"
        init-script: "init.sql"
        properties:
          eclipselink.target-database: "org.eclipse.persistence.platform.database.H2Platform"
          eclipselink.target-server: "None"
          eclipselink.weaving: false
