application:
  batches:
    insert: INSERT INTO CONTACT (NAME, EMAIL) VALUES (?, ?)
    records: |-
      UPDATE CONTACT SET NAME = ?, EMAIL = ? WHERE ID = ?
    arrays: |-
      UPDATE CONTACT SET EMAIL = ? WHERE ID = ?
    names: |-
      INSERT INTO CONTACT (NAME) VALUES (?)
    duplicates: |-
      UPDATE CONTACT SET NAME = ? WHERE ID = ? AND NAME = ?
    aligned: |-
      UPDATE CONTACT SET NAME = ?, EMAIL = ? WHERE ID = ? AND NAME <> ? AND ID = ?
    aliases: |-
      UPDATE CONTACT SET NAME = :name, EMAIL = :email WHERE ID = :id OR ID = :id
    inherited: |-
      INSERT INTO CONTACT (NAME, EMAIL) VALUES (:name, :email)
    without-names: |-
      INSERT INTO CONTACT (NAME, EMAIL) VALUES (?, ?)
    bytes: |-
      UPDATE SCALAR_VALUE SET BYTES_VALUE = ? WHERE ID = ?
    constant: |-
      UPDATE SCALAR_VALUE SET BYTES_VALUE = :value WHERE ID = :ids
    varargs: |-
      UPDATE SCALAR_VALUE SET BYTE_VALUE = ? WHERE ID = 1
    scalars: |-
      UPDATE SCALAR_VALUE SET BYTES_VALUE = :bytes, DECIMAL_VALUE = :decimal, LOCAL_DATE_VALUE = :date, LOCAL_TIME_VALUE = :time, LOCAL_DATE_TIME_VALUE = :dateTime, DATE_VALUE = :sqlDate, TIME_VALUE = :sqlTime, TIMESTAMP_VALUE = :sqlTimestamp WHERE ID = :id
