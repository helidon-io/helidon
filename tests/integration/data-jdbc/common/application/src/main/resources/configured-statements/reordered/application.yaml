application:
  sql:
    find: |-
      SELECT ID, NAME, EMAIL FROM CONTACT
      WHERE EMAIL = :email OR NAME = :name OR EMAIL = :email ORDER BY ID
    rename: |-
      UPDATE CONTACT SET NAME = :name WHERE ID = :id
    insert: |-
      INSERT INTO CONTACT (NAME) VALUES (:value)
    by-id: |-
      SELECT ID, NAME, EMAIL FROM CONTACT WHERE ID = :id
  aliases:
    find: |-
      SELECT NAME FROM CONTACT
      WHERE EMAIL = :email OR (:email IS NULL AND EMAIL IS NULL) OR EMAIL = :email ORDER BY ID
    insert: |-
      INSERT INTO CONTACT (EMAIL, NAME) VALUES (:email, :rows)
    update: |-
      UPDATE CONTACT SET NAME = :name WHERE ID = :id AND :name = :name
reporting:
  catalog:
    contacts:
      all: SELECT ID, NAME, EMAIL FROM CONTACT ORDER BY ID
