application:
  calls:
    command: "{call sp_noop()}"
    input: "{call sp_write(?)}"
    output: "{call sp_out(:value)}"
    values: "{call sp_values(:input, :value, :other)}"
    inout: "{call sp_inout(:input, :value)}"
    aliased-inout: "{call sp_inout(:input, :value)}"
    total: "{? = call sp_add(?)}"
    repeated: "{? = call sp_sum(:input, :input)}"
    cursor: "{? = call sp_cursor(?)}"
    direct: "{call sp_direct()}"
    mixed: "{? = call sp_mixed(?, ?, ?)}"
    leading-outputs: "{call sp_values_reordered(:other, :value, :input)}"
    bundle: "{call sp_bundle(:input, :value, :rows)}"
