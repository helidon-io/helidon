name: "Validate"

on:
  pull_request:
  push:
    branches-ignore: [ 'release-*' ]
    tags-ignore: [ '**' ]

env:
  JAVA_VERSION: '11'
  JAVA_DISTRO: 'temurin'
  HELIDON_PIPELINES: 'true'
  MVN_ARGS: |
    -B -fae -e -ntp
    -Dmaven.wagon.httpconnectionManager.ttlSeconds=60
    -Dmaven.wagon.http.retryHandler.count=3

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  copyright:
    timeout-minutes: 10
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v3.6.0
        with:
          distribution: ${{ env.JAVA_DISTRO }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - run: etc/scripts/copyright.sh
  checkstyle:
    timeout-minutes: 10
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v3.6.0
        with:
          distribution: ${{ env.JAVA_DISTRO }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - run: etc/scripts/checkstyle.sh
  spotbugs:
    timeout-minutes: 45
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v3.6.0
        with:
          distribution: ${{ env.JAVA_DISTRO }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - run: |
          mvn ${MVN_ARGS} -e \
            -DskipTests \
            -Pspotbugs,pipeline \
            install
  build:
    timeout-minutes: 60
    strategy:
      matrix:
        os: [ ubuntu-22.04 ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v3.6.0
        with:
          distribution: ${{ env.JAVA_DISTRO }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - run: |
          mvn ${MVN_ARGS} -e \
              -Dmaven.test.failure.ignore=false \
              -Pjavadoc,sources,tests,pipeline \
              install
      - name: Archive test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            **/target/surefire-reports/*.txt
            **/target/it/**/*.log
  docs:
    timeout-minutes: 20
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v3.6.0
        with:
          distribution: ${{ env.JAVA_DISTRO }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - run: |
          # prime build
          mvn ${MVN_ARGS} -e \
            -DskipTests \
            -Pdocs,pipeline \
            install

          # build docs
          mvn ${MVN_ARGS} -e \
            -f docs/pom.xml \
            -Pdocs,pipeline \
            install
      - name: Archive Docs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docs
          path: |
            docs/target/docs/**/*
            javadocs/target/**/*
  tck:
    timeout-minutes: 60
    strategy:
      matrix:
        os: [ ubuntu-22.04 ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v3.6.0
        with:
          distribution: ${{ env.JAVA_DISTRO }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - run: |
          # prime build
          mvn ${MVN_ARGS} -e \
            -DskipTests \
            -Ppipeline \
            install

          # run TCKs
          mvn ${MVN_ARGS} -e \
              -f microprofile/tests/tck/pom.xml \
              -Dmaven.test.failure.ignore=false \
              verify
  examples:
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ ubuntu-22.04 ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v3.6.0
        with:
          distribution: ${{ env.JAVA_DISTRO }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - run: |
          # prime build
          mvn ${MVN_ARGS} -e \
            -DskipTests \
            -Ppipeline \
            install

          # build examples
          mvn ${MVN_ARGS} -e \
            -f examples/pom.xml \
            verify
  archetypes:
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ ubuntu-22.04 ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v3.6.0
        with:
          distribution: ${{ env.JAVA_DISTRO }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - run: |
          # prime build
          mvn ${MVN_ARGS} -e \
            -DskipTests \
            -Ppipeline \
            install

          ./examples/quickstarts/archetypes/test-archetypes.sh
