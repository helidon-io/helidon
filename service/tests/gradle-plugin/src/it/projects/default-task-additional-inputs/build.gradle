import io.helidon.service.gradle.plugin.GenerateBindings

plugins {
    id 'java'
    id 'io.helidon.service'
}

java { toolchain { languageVersion = JavaLanguageVersion.of(@version.java@) } }

dependencies {
    implementation 'io.helidon.service:helidon-service-registry:@project.version@'
    annotationProcessor 'io.helidon.codegen:helidon-codegen-apt:@project.version@'
    annotationProcessor 'io.helidon.service:helidon-service-codegen:@project.version@'
}

helidonService {
    packageName = 'example'
    bindingClassName = 'ApplicationBinding'
}

def compileExtra = tasks.register('compileExtra', JavaCompile) {
    source = fileTree('src/extra/java')
    classpath = sourceSets.main.compileClasspath
    options.annotationProcessorPath = configurations.annotationProcessor
    destinationDirectory = layout.buildDirectory.dir('classes/extra/main')
}

tasks.named('generateApplicationBindings', GenerateBindings) {
    dependsOn compileExtra
    classpath.from(compileExtra.flatMap { it.destinationDirectory })
    sourceRoots.from(file('src/extra/java'))
}

tasks.register('runApplication', JavaExec) {
    dependsOn tasks.named('jar'), compileExtra
    classpath = files(tasks.named('jar').flatMap { it.archiveFile },
                      compileExtra.flatMap { it.destinationDirectory }) + configurations.runtimeClasspath
    mainClass = 'example.Main'
}
