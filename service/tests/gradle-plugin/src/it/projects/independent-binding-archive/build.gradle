import io.helidon.service.gradle.plugin.GenerateBindings

plugins {
    id 'java'
    id 'io.helidon.service'
}

java { toolchain { languageVersion = JavaLanguageVersion.of(@version.java@) } }

dependencies {
    implementation 'io.helidon.service:helidon-service-registry:@project.version@'
    annotationProcessor 'io.helidon.codegen:helidon-codegen-apt:@project.version@'
    annotationProcessor 'io.helidon.service:helidon-service-codegen:@project.version@'
}

helidonService {
    packageName = 'example'
    bindingClassName = 'ApplicationBinding'
}

sourceSets { other }
configurations {
    otherImplementation.extendsFrom implementation
    otherAnnotationProcessor.extendsFrom annotationProcessor
}

def compileOther = tasks.named(sourceSets.other.compileJavaTaskName, JavaCompile)
def generateOther = tasks.register('generateOtherBinding', GenerateBindings) {
    dependsOn compileOther
    classpath.from(configurations.otherRuntimeClasspath)
    sourceRoots.from(sourceSets.other.allJava.sourceDirectories)
    options.bindingClassName = 'OtherBinding'
    options.generateMain = true
    options.mainClassName = 'OtherMain'
    prependClassesTo(sourceSets.other)
}
tasks.named(sourceSets.other.classesTaskName) { dependsOn generateOther }

def otherJar = tasks.register('otherJar', Jar) { jar ->
    archiveClassifier = 'other'
    from(sourceSets.other.output)
    generateOther.get().addExclusionsTo(jar)
}

tasks.register('otherRun', JavaExec) {
    dependsOn otherJar
    classpath = files(otherJar.flatMap { it.archiveFile }) + configurations.otherRuntimeClasspath
    mainClass = 'other.Main'
}
