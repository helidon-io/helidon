# Full configuration of JWT provider
security:
  providers:
    - jwt:
        # If set to true, provider will abstain rather than fail if header is not available
        # defaults to false
        optional: true
        # If set to false, no authentication will be attempted
        # If set to false and this is the default provider, authentication will not work
        # Set to false for outbound-only providers that should not authenticate inbound requests
        # defaults to true
        authenticate: true
        # DANGEROUS: Accept tokens with algorithm "none" and no key ID; defaults to false.
        # Such tokens do not require or load verification JWKs. Signed tokens still require matching keys.
        allow-unsigned: false
        # If set to true, identity will be propagated further using the configured header and format
        # The user id from current subject will be propagated
        # defaults to true
        propagate: true
        # Can be USER or SERVICE
        # defaults to USER
        principal-type: USER
        # Loading policy for verification JWK resources configured with a filesystem path or URI.
        # Classpath and inline resources are validated at startup and do not use this policy.
        # The circuit breaker wraps a complete retry batch, and timeout applies to each attempt.
        # The timeout must be positive, run on the calling thread, and not exceed the retry overall timeout.
        # Once verification keys load successfully, that value is cached for the life of the provider.
        jwk-loader:
          timeout:
            # Maximum duration of each load attempt; defaults to 5 seconds
            timeout: "PT5S"
            # Required so a retry cannot overlap an attempt still unwinding after interruption; defaults to true
            current-thread: true
            # Whether metrics are enabled for verification-key loading timeouts; defaults to false
            enable-metrics: false
          retry:
            # Total number of load calls, including the initial call; defaults to 2
            calls: 2
            # Base delay between calls; defaults to 200 milliseconds
            delay: "PT0.2S"
            # Delay factor; -1 selects the default factor unless jitter is configured
            delay-factor: -1.0
            # Retry jitter; the negative default leaves jitter disabled
            jitter: "PT-1S"
            # Overall budget for both timed attempts and the delay; defaults to 11 seconds
            overall-timeout: "PT11S"
            # Whether metrics are enabled for verification-key loading retries; defaults to false
            enable-metrics: false
          circuit-breaker:
            # Time before an open circuit permits a probe; defaults to 5 seconds
            delay: "PT5S"
            # One exhausted retry batch opens the circuit by default
            volume: 1
            error-ratio: 100
            # Successful probes required to close the circuit; defaults to 1
            success-threshold: 1
            # Whether metrics are enabled for the verification-key loading circuit; defaults to false
            enable-metrics: false
        # Token extraction
        atn-token:
          # JWK configuration (where to get keys for verification/signatures)
          # either of the following (as defined in Resource utility):
          jwk.resource:
            resource-path: "classpath/resource"
            # path: "/filesystem/path/of/jwk"
            # uri: "http://url/of/jwk"
            # content-plain: "{}"
            # content: "base64"
          # Whether to verify inbound JWT signatures
          # If set to false while authenticate is true, atn-token.jwt-issuer and
          # atn-token.jwt-audience are both required
          # defaults to true
          verify-signature: true
          # expected issuer of inbound JWTs
          # Required when authenticate is true and verify-signature is false
          jwt-issuer: "issuer.of.JWT"
          # expected audience of inbound JWTs
          # Required when authenticate is true and verify-signature is false
          jwt-audience: "audience"
          handler:
            # name of header to extract token from (see providers-common module for all options), defaults to "Authorization"
            header: "Authorization"
            # or do not specify - then the whole header is considered to be the token value, defaults to "bearer "
            prefix: "bearer "
            # optional alternative - looking for first matching group
            # regexp: "bearer (.*)"
            # format: "string format to generate outbound token"
        # Optional - if not defined, atn-token config will be used for identity propagation (and the same token will be
        # propagated)
        sign-token:
          jwk.resource:
            # JWK configuration (where to get keys for signatures)
            # This is defined only once, as we can have more keys in a single jwk
            # either of the following:
            resource-path: "classpath/resource"
            # path: "/filesystem/path/of/jwk"
            # uri: "http://url/of/jwk"
            # content-plain: "{}"
            # content: "base64"
          jwt-issuer: "issuer.of.JWT"
          # Used by OutboundConfig
          outbound:
            - name: "internal-service"
              transports:
                - "http"
                - "https"
              hosts:
                - "*.oracle.com"
              paths:
                - "*"
              # if we want to create a new token based on current subject
              # we need the key to sign - if the following is not present
              # we just propagate existing token
              jwk-kid: "key-id-to-use"
              jwt-kid: "key-id-to-put-to-jwt"
              jwt-audience: "audience"
              # notBefore = now - jwt-not-before-seconds
              # defaults to 5 seconds
              jwt-not-before-seconds: 60
              # expiration = now + jwt-validity-seconds
              # defaults to 1 day
              jwt-validity-seconds: 3600
              # defaults to the same as inbound
              outbound-token:
                header: "Custom"
                format: "bearer %1$s"
